<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XAICG</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <img src="icons/icon48.png" alt="">
      <div>
        <strong>XAICG</strong>
        <small>X AI Comment/Reply Generator</small>
      </div>
    </div>
    <span id="planBadge" class="badge">…</span>
  </header>

  <main>
    <section id="start" class="card start" aria-label="Start your free trial" hidden>
      <h2>Start your free trial</h2>
      <p class="muted">Sign in with Google and get <b id="startCount">20</b> free generations. No card and no license needed.</p>
      <button id="startSignIn" class="gsi" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Sign in with Google</span></button>
      <p id="startStatus" class="status" role="status" aria-live="polite"></p>
    </section>
    <p id="problem" class="problem" role="alert" hidden></p>

    <section id="usage" class="card" aria-label="Usage">
      <div class="quota-line">
        <span><b id="quotaLeft">–</b> <span id="quotaLabel" class="muted">generations left</span></span>
        <span id="quotaSub" class="muted small"></span>
      </div>
      <div id="quotaBar" class="bar"><i></i></div>
      <p id="notice" class="notice" hidden></p>
    </section>

    <section class="card compose" aria-label="Compose">
      <div class="segmented" role="group" aria-label="What to write">
        <button type="button" data-mode="post" aria-pressed="true">Post</button>
        <button type="button" data-mode="thread" aria-pressed="false">Thread</button>
        <button type="button" data-mode="rewrite" aria-pressed="false">Rewrite</button>
      </div>

      <div>
        <label for="input" id="inputLabel">What's the post about?</label>
        <textarea id="input" maxlength="1000" placeholder="A rough idea is enough. For example: shipping small things weekly beats one big launch."></textarea>
      </div>

      <div class="row">
        <div>
          <label for="tone">Tone</label>
          <select id="tone">
            <option value="">My default</option>
            <option value="auto">Auto</option>
            <option value="casual">Casual</option>
            <option value="witty">Witty</option>
            <option value="supportive">Supportive</option>
            <option value="skeptical">Skeptical</option>
            <option value="analytical">Analytical</option>
            <option value="blunt">Blunt</option>
            <option value="technical">Technical</option>
            <option value="professional">Professional</option>
          </select>
        </div>
        <div id="sizeField">
          <label for="size">Length</label>
          <select id="size">
            <option value="short">Short</option>
            <option value="medium" selected>Medium</option>
            <option value="long">Long</option>
          </select>
        </div>
        <div id="tweetsField" hidden>
          <label for="tweets">Posts</label>
          <select id="tweets">
            <option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option><option>8</option>
          </select>
        </div>
      </div>

      <button id="generate" class="btn primary" type="button">Generate</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="results" class="results" aria-label="Drafts" hidden>
      <div class="results-head">
        <strong id="resultsTitle">Drafts</strong>
        <button id="copyAll" class="btn sm" type="button" hidden>Copy thread</button>
      </div>
      <ol id="resultList"></ol>
    </section>
  </main>

  <footer>
    <div class="foot-actions">
      <button id="openOptions" class="btn sm" type="button">Settings</button>
      <a id="upgrade" class="btn sm" target="_blank" rel="noopener" hidden>See plans</a>
    </div>
    <p class="credit">A product of <a href="https://uniquelabs.org" target="_blank" rel="noopener">Unique Labs</a> · Developed by Shahriar Ahmed</p>
  </footer>

  <script src="lib/sfx.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
